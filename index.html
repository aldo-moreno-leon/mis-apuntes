<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis apuntes</title>
  <meta name="theme-color" content="#0a0e14">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0e14'/><text x='4' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%2339ff88'>>_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <button id="boton-menu" class="boton-menu" aria-label="Abrir menú">☰</button>

  <aside id="menu" class="menu">
    <a href="#/" class="marca"><span class="prompt">~$</span> mis_apuntes<span class="cursor">_</span></a>
    <input id="buscador" class="buscador" type="search" placeholder="grep en los apuntes…   [ / ]" autocomplete="off">
    <button id="nuevo-tema" class="boton boton-principal ancho" hidden>+ Nuevo tema</button>
    <nav id="lista-temas" class="lista-temas" aria-label="Temas"></nav>
    <p id="modo" class="modo"></p>
  </aside>

  <main id="contenido" class="contenido"></main>

  <dialog id="dialogo" class="dialogo">
    <form method="dialog">
      <h2 id="dialogo-titulo"></h2>
      <div id="dialogo-campos"></div>
      <div class="acciones">
        <button value="cancelar" class="boton" formnovalidate>Cancelar</button>
        <button value="ok" id="dialogo-boton" class="boton boton-principal">Crear</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
